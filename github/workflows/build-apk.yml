name: Build Ionic Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout project
      # --------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Set up Node.js 
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # --------------------------------------------------
      # 4. Build Ionic/vue application
      # --------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # --------------------------------------------------
      # 5. Set up Java 21
      # --------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # --------------------------------------------------
      # 6. Check Java environment
      # --------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"


      # --------------------------------------------------
      # 7. Sync Capacitor Android
      # --------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # --------------------------------------------------
      # 8. Give Gradle execution permission
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # --------------------------------------------------
      # 9. Check Gradle environment
      # --------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # --------------------------------------------------
      # 10. Build Android Debug APK
      # --------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # --------------------------------------------------
      # 11. Rename APK
      # --------------------------------------------------
      - name: ionic-calculator.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IonicCalculator.apk


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IonicCalculator-APK
          path: IonicCalculator.apk
          if-no-files-found: error
          retention-days: 30